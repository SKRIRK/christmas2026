<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d0c">
<meta name="description" content="文字で描く、冬の夜。ASCII CHRISTMAS 2026">
<meta property="og:type" content="website">
<meta property="og:title" content="ASCII CHRISTMAS 2026">
<meta property="og:description" content="文字で描く、冬の夜。クリスマスのメッセージが届きました。">
<meta property="og:url" content="https://skrirk.github.io/christmas2026/">
<meta property="og:image" content="https://skrirk.github.io/christmas2026/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>ASCII CHRISTMAS 2026</title>
<link rel="stylesheet" href="style.css">
<script src="christmas.js" defer></script>
</head>
<body>
<main class="terminal">
  <section class="stage" aria-label="雪の中で回転する文字のクリスマスツリー">
    <canvas id="scene" aria-hidden="true"></canvas>
    <span class="stage-label" aria-hidden="true">◇ SCENE / 3D</span>
    <output id="countdown" aria-label="クリスマスまで"></output>
    <div class="greeting" id="greeting" hidden>
      <p class="wish">Merry Christmas <span>2026</span></p>
      <p id="message" hidden></p>
    </div>
  </section>
  <div class="controls">
    <button id="replay" type="button">↻ 再生し直す</button>
    <button id="music" type="button" aria-pressed="false">♫ Santa Tell Me <span id="music-state">再生</span></button>

    <audio id="soundtrack" preload="auto" src="santa-tell-me.mp3"></audio>
    <output id="music-error" aria-live="polite" hidden></output>
  </div>
  <details class="settings">
    <summary>メッセージ・表示設定</summary>
    <form id="share-form">
      <label for="recipient">相手の名前（任意）</label>
      <input id="recipient" maxlength="32" placeholder="例：〇〇さん">
      <label for="custom">メッセージ</label>
      <textarea id="custom" maxlength="240" rows="3"></textarea>
      <label class="check"><input type="checkbox" id="show-countdown" checked> カウントダウンを表示する</label>
      <button type="submit">共有リンクを作る</button>
      <div id="share-result" hidden>
        <label for="share-url">共有リンク</label>
        <div class="share-row"><input id="share-url" readonly><button id="copy" type="button">コピー</button></div>
        <small>リンクを知っている人はメッセージを読めます。</small>
      </div>
      <output id="feedback" aria-live="polite"></output>
    </form>
  </details>
  <noscript>アニメーションを表示するには JavaScript を有効にしてください。</noscript>
</main>
</body>
</html>
